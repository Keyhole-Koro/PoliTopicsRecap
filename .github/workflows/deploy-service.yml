name: Deploy Service

on:
  push:
    branches:
      - stage
      - prod
  workflow_dispatch:

env:
  NODE_VERSION: "22"
  TERRAFORM_VERSION: "1.9.5"
  TF_WORKING_DIR: terraform

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: ${{ startsWith(github.event.workflow_run.head_branch || github.ref_name, 'prod') && 'production' || 'stage' }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-3' }}
      TF_VAR_discord_webhook_error: ${{ secrets.DISCORD_WEBHOOK_ERROR }}
      TF_VAR_discord_webhook_warn: ${{ secrets.DISCORD_WEBHOOK_WARN }}
      TF_VAR_discord_webhook_batch: ${{ secrets.DISCORD_WEBHOOK_BATCH }}
      TF_VAR_r2_endpoint_url: ${{ secrets.R2_ENDPOINT_URL }}
      TF_VAR_r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
      TF_VAR_r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine deployment variables
        id: vars
        run: |
          branch="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          if [[ "$branch" == prod* ]]; then
            env_name="prod"
            tf_vars_file="prod.tfvars"
            tf_backend_file="prod.hcl"
          else
            env_name="stage"
            tf_vars_file="stage.tfvars"
            tf_backend_file="stage.hcl"
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "env=$env_name" >> "$GITHUB_OUTPUT"
          echo "tf_vars_file=$tf_vars_file" >> "$GITHUB_OUTPUT"
          echo "tf_backend_file=$tf_backend_file" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.vars.outputs.env == 'prod' && secrets.PROD_DEPLOY_ROLE_ARN || secrets.STAGE_DEPLOY_ROLE_ARN }}
          role-session-name: politopics-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Export TF_VAR_gemini_api_key
        env:
          DEPLOY_ENV: ${{ steps.vars.outputs.env }}
          PROD_GEMINI_API_KEY: ${{ secrets.PROD_GEMINI_API_KEY }}
          STAGE_GEMINI_API_KEY: ${{ secrets.STAGE_GEMINI_API_KEY }}
        run: |
          if [[ "$DEPLOY_ENV" == "prod" ]]; then
            echo "TF_VAR_gemini_api_key=$PROD_GEMINI_API_KEY" >> "$GITHUB_ENV"
          else
            echo "TF_VAR_gemini_api_key=$STAGE_GEMINI_API_KEY" >> "$GITHUB_ENV"
          fi

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend-config="backends/${{ steps.vars.outputs.tf_backend_file }}"

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -var-file="tfvars/${{ steps.vars.outputs.tf_vars_file }}" -out=tfplan

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan

      - name: Build and push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: politopics-recap-${{ steps.vars.outputs.env }}
          IMAGE_TAG: latest
          DEPLOY_ENV: ${{ steps.vars.outputs.env }}
        run: |
          pnpm run docker:build:$DEPLOY_ENV
          docker tag politopics-recap:$DEPLOY_ENV $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
